name: rebuild-wasm

# Rebuilds the CSPICE WASM from the pinned NAIF package with the pinned
# Emscripten version (EMSDK_VERSION in scripts/build-cspice.sh, the one place it
# is recorded) and checks it three ways: against the committed artifacts, which
# the rebuild must reproduce byte for byte or the job fails; against a build of
# the arturania/cspice fork made the way this project built before it moved to
# the NAIF package (same compiler, so any difference is a source difference;
# reported, not gating); and against the full test suite. Runs on demand, on
# pull requests that change the build inputs or the artifacts, and on main when
# they change there.
#
# A manual run may name another Emscripten version to try a bump. That run is
# expected to fail the byte comparison (the committed artifacts belong to the
# pinned version); its value is the test suite result and the uploaded
# artifacts. Committing artifacts for a new pin is the job of the
# commit-wasm-artifacts workflow.

on:
  workflow_dispatch:
    inputs:
      emsdk:
        description: Emscripten version to try in place of the pinned one (leave empty for the pin)
        default: ''
  pull_request:
    paths:
      - scripts/build-cspice.sh
      - scripts/cspice-exports.txt
      - patches/**
      - wasm/cspice.wasm
      - wasm/cspice.mjs
      - .github/workflows/rebuild-wasm.yml
  push:
    branches: [main]
    paths:
      - scripts/build-cspice.sh
      - scripts/cspice-exports.txt
      - patches/**
      - wasm/cspice.wasm
      - wasm/cspice.mjs
      - .github/workflows/rebuild-wasm.yml

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Read the pinned Emscripten version
        id: pin
        run: echo "version=$(bash scripts/build-cspice.sh --emsdk-version)" >> "$GITHUB_OUTPUT"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ inputs.emsdk || steps.pin.outputs.version }}
      - run: sudo apt-get update && sudo apt-get install -y csh
      - run: pnpm install --frozen-lockfile

      - name: Record the committed artifacts
        run: |
          sha256sum wasm/cspice.wasm wasm/cspice.mjs | tee /tmp/committed.sha256
          wc -c wasm/cspice.wasm wasm/cspice.mjs

      - name: Build the previous way, from the fork, for comparison
        run: |
          emcc --version | head -1
          git clone -q https://github.com/arturania/cspice.git /tmp/fork
          git -C /tmp/fork checkout -q 53bce326267dd2d6d567de92b15869c9ed7d0629
          ( cd /tmp/fork/src && csh ./mk_wasm.csh > /tmp/fork-build.log 2>&1 ) || { tail -40 /tmp/fork-build.log; exit 1; }
          mkdir -p /tmp/forkout
          REPO_ROOT="$PWD"
          sed -n '/^EXPORTS_FILE=/,/^emcc /p' scripts/build-cspice.sh | sed '$d' > /tmp/link-vars.sh
          . /tmp/link-vars.sh
          emcc /tmp/fork/lib/libcspice_wasm.a -o /tmp/forkout/cspice.mjs -O2 \
            -s MODULARIZE=1 -s EXPORT_ES6=1 -s EXPORT_NAME=CSpice -s WASM=1 \
            -s ALLOW_MEMORY_GROWTH=1 -s INITIAL_MEMORY=167772160 -s STACK_SIZE=5242880 \
            -s FORCE_FILESYSTEM=1 -s EXPORTED_RUNTIME_METHODS="$RUNTIME_METHODS" \
            -s EXPORTED_FUNCTIONS="$EXPORTS"
          sha256sum /tmp/forkout/cspice.wasm; wc -c /tmp/forkout/cspice.wasm

      - name: Rebuild from the pinned NAIF package
        env:
          CSPICE_ALLOW_EMSDK_MISMATCH: ${{ inputs.emsdk && '1' || '0' }}
        run: pnpm cspice:build

      - name: Compare
        id: compare
        run: |
          sha256sum wasm/cspice.wasm wasm/cspice.mjs | tee /tmp/rebuilt.sha256
          wc -c wasm/cspice.wasm wasm/cspice.mjs
          if cmp -s wasm/cspice.wasm /tmp/forkout/cspice.wasm; then
            echo "SAME AS FORK BUILD: the NAIF package plus patches compiles to the same cspice.wasm, byte for byte, as the fork." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "DIFFERS FROM FORK BUILD: cspice.wasm from the NAIF package plus patches is not byte-identical to the fork build." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if diff -q /tmp/committed.sha256 /tmp/rebuilt.sha256 >/dev/null; then
            echo "BIT-IDENTICAL TO COMMITTED: the rebuild reproduces the committed artifacts byte for byte." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "identical=true" >> "$GITHUB_OUTPUT"
          else
            echo "NOT BIT-IDENTICAL TO COMMITTED: the rebuild differs from the committed artifacts. With the pinned Emscripten this is a failure; with another version it is expected." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "identical=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the full suite against the rebuilt artifacts
        run: pnpm verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuilt-wasm
          path: |
            wasm/cspice.wasm
            wasm/cspice.mjs

      # Last, so the suite result and the uploaded artifacts are there to read
      # when it fails: the committed artifacts must be what the build produces.
      - name: Fail unless the rebuild reproduces the committed artifacts
        if: always()
        run: |
          if [ "${{ steps.compare.outputs.identical }}" != "true" ]; then
            echo "::error::wasm/cspice.wasm or wasm/cspice.mjs is not byte-identical to a rebuild from scripts/build-cspice.sh. See README.md, Rebuilding the WASM."
            exit 1
          fi
