name: rebuild-wasm

# Rebuilds the CSPICE WASM from the pinned source with Emscripten and checks it
# against the committed artifacts. Two questions, answered separately: does the
# rebuilt module pass the full test suite (functional reproducibility), and is it
# byte-identical to the committed one (bit reproducibility, which also depends on
# the Emscripten version). Runs on demand and whenever the build script changes.

on:
  workflow_dispatch:
    inputs:
      emsdk:
        description: Emscripten SDK version
        default: latest
  pull_request:
    paths:
      - scripts/build-cspice.sh
      - .github/workflows/rebuild-wasm.yml

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ inputs.emsdk || 'latest' }}
      - run: sudo apt-get update && sudo apt-get install -y csh
      - run: pnpm install --frozen-lockfile

      - name: Record the committed artifacts
        run: |
          sha256sum wasm/cspice.wasm wasm/cspice.mjs | tee /tmp/committed.sha256
          wc -c wasm/cspice.wasm wasm/cspice.mjs

      - name: Rebuild from the pinned CSPICE source
        run: |
          emcc --version | head -1
          pnpm cspice:build

      - name: Compare with the committed artifacts
        run: |
          sha256sum wasm/cspice.wasm wasm/cspice.mjs | tee /tmp/rebuilt.sha256
          wc -c wasm/cspice.wasm wasm/cspice.mjs
          if diff -q /tmp/committed.sha256 /tmp/rebuilt.sha256 >/dev/null; then
            echo "BIT-IDENTICAL: the rebuild reproduces the committed artifacts byte for byte." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "NOT BIT-IDENTICAL: the rebuild differs from the committed artifacts (expected when the Emscripten version differs)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run the full suite against the rebuilt artifacts
        run: pnpm verify

      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt-wasm
          path: |
            wasm/cspice.wasm
            wasm/cspice.mjs
